<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="__QBTHEME_BASE__/theme.css" />
    <script src="__QBTHEME_BASE__/theme.js" defer></script>
    <title>Boss Menu</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        const root = document.getElementById("app");
        const resize = () => {
          const scale = Math.min(2, Math.max(1, Math.min(window.innerWidth / 2560, window.innerHeight / 1440)));
          root.style.width = `${window.innerWidth / scale}px`;
          root.style.height = `${window.innerHeight / scale}px`;
          root.style.transform = `scale(${scale})`;
          root.style.transformOrigin = "top left";
        };
        resize();
        window.addEventListener("resize", resize);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
