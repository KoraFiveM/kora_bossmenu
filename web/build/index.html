<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cfx-nui-qbtheme/theme.css" />
    <script src="https://cfx-nui-qbtheme/theme.js?v=3" defer></script>
    <title>Boss Menu</title>
    <script type="module" crossorigin src="./assets/index-6E0gR8f4.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CmFFTewx.css">
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        const root = document.getElementById("app");
        const resize = () => {
          const scale = Math.min(2, Math.max(0.5, Math.min(window.innerWidth / 1920, window.innerHeight / 1080)));
          root.style.width = `${window.innerWidth / scale}px`;
          root.style.height = `${window.innerHeight / scale}px`;
          root.style.transform = `scale(${scale})`;
          root.style.transformOrigin = "top left";
        };
        resize();
        window.addEventListener("resize", resize);
      })();
    </script>
  </body>
</html>
